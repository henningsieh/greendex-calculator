packages:
  - apps/*
  - packages/*

linkWorkspacePackages: true
networkConcurrency: 16

catalog:
  react: 19.3.0
  react-dom: 19.3.0
  react-email: 6.11.0
  next: 16.4.0
  next-intl: 4.14.9
  dotenv: ^18.0.5
  oxfmt: ^0.72.0
  oxlint: ^1.87.0
  tsx: ^4.23.15
  vitest: ^5.0.3
  better-auth: 1.7.7
  typescript: 7.0.2
  "@types/node": 26.6.4
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

hoistPattern:
  - typescript
  - react
  - drizzle-orm
  - pg

# Expose the single catalog-resolved Next.js install (and with it the bundled
# version-matched docs at node_modules/next/dist/docs) at the workspace root, so
# the Next.js-managed agent-rules block in the root AGENTS.md resolves verbatim.
# This creates a link to the one install; it never adds a second copy.
publicHoistPattern:
  - next

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - turbo@2.11.7
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - "@shadcn/lint@0.2.0"
  - "@next/env@16.4.0"
  - "@next/swc-darwin-arm64@16.4.0"
  - "@next/swc-darwin-x64@16.4.0"
  - "@next/swc-linux-arm64-gnu@16.4.0"
  - "@next/swc-linux-arm64-musl@16.4.0"
  - "@next/swc-linux-x64-gnu@16.4.0"
  - "@next/swc-linux-x64-musl@16.4.0"
  - "@next/swc-win32-arm64-msvc@16.4.0"
  - "@next/swc-win32-x64-msvc@16.4.0"
  - next@16.4.0
