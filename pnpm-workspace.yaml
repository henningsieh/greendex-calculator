packages:
  - apps/*
  - packages/*

linkWorkspacePackages: true
networkConcurrency: 16

catalog:
  react: 19.2.8
  react-dom: 19.2.8
  react-email: 6.9.3
  next: 16.3.5
  next-intl: 4.14.2
  better-auth: 1.7.3
  typescript: 7.0.2
  "@types/node": 26.4.1
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7

hoistPattern:
  - typescript
  - react
  - drizzle-orm
  - pg

# Expose the single catalog-resolved Next.js install (and with it the bundled
# version-matched docs at node_modules/next/dist/docs) at the workspace root, so
# the Next.js-managed agent-rules block in the root AGENTS.md resolves verbatim.
# This creates a link to the one install; it never adds a second copy.
publicHoistPattern:
  - next

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.10.12"
  - "@turbo/darwin-arm64@2.10.12"
  - "@turbo/linux-64@2.10.12"
  - "@turbo/linux-arm64@2.10.12"
  - "@turbo/windows-64@2.10.12"
  - "@turbo/windows-arm64@2.10.12"
  - turbo@2.10.12
